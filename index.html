<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danh sách Truyện Audio</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 16px; max-width: 480px; margin: 0 auto; box-sizing: border-box; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .app-title { font-size: 20px; font-weight: 700; color: #fff; margin: 0; }
        
        .sync-actions { display: flex; gap: 8px; }
        .sync-btn { background: #1f1f26; border: 1px solid #333; color: #ccc; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .sync-btn:hover { background: #2a2a35; color: #fff; border-color: #555; }

        .add-story-btn { background: #d95a52; color: #fff; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; display: block; text-align: center; margin-bottom: 20px; }
        .add-story-btn:hover { background: #e06d67; }

        .story-list { display: flex; flex-direction: column; gap: 12px; }
        .story-card { background: #19191e; border: 1px solid #25252c; border-radius: 12px; padding: 12px; display: flex; gap: 14px; align-items: center; transition: 0.2s; }
        .story-card:hover { border-color: #383844; background: #1d1d24; }
        
        .story-cover { width: 65px; height: 90px; border-radius: 8px; object-fit: cover; flex-shrink: 0; border: 1px solid #333; cursor: pointer; }
        .story-info { flex: 1; overflow: hidden; cursor: pointer; }
        .story-name { font-size: 15px; font-weight: 700; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .story-author { font-size: 12px; color: #aaa; margin: 0 0 8px 0; }
        .story-tag { background: #262630; color: #bbb; font-size: 10px; padding: 3px 8px; border-radius: 4px; display: inline-block; border: 1px solid #333; }

        /* Nút xóa truyện */
        .delete-story-btn { background: none; border: none; color: #666; font-size: 18px; cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.2s; }
        .delete-story-btn:hover { color: #d95a52; background: rgba(217,90,82,0.1); }
    </style>
</head>
<body>

    <div class="header-row">
        <h1 class="app-title">Kho Truyện Audio</h1>
        <div class="sync-actions">
            <button class="sync-btn" onclick="exportData()" title="Xuất file backup">📤 Xuất</button>
            <button class="sync-btn" onclick="triggerImport()" title="Nhập file backup">📥 Nhập</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <a href="add-story.html" class="add-story-btn">+ Thêm truyện mới</a>

    <div class="story-list" id="storyListContainer">
        <div style="text-align: center; color: #666; font-size: 13px; margin-top: 40px;">Đang tải danh sách truyện...</div>
    </div>

    <script>
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('AudioBookDB', 2);
                request.onupgradeneeded = function(e) {
                    let db = e.target.result;
                    if (!db.objectStoreNames.contains('stories')) db.createObjectStore('stories', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('audios')) db.createObjectStore('audios');
                };
                request.onsuccess = e => resolve(e.target.result);
                request.onerror = e => reject(e.target.error);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStoriesFromDB();
        });

        async function loadStoriesFromDB() {
            try {
                let db = await openDB();
                let tx = db.transaction('stories', 'readonly');
                let store = tx.objectStore('stories');
                
                let stories = [];
                store.openCursor().onsuccess = function(e) {
                    let cursor = e.target.result;
                    if (cursor) {
                        stories.push(cursor.value);
                        cursor.continue();
                    } else {
                        stories.sort((a, b) => {
                            let timeA = parseInt(a.id.replace('story_', '')) || 0;
                            let timeB = parseInt(b.id.replace('story_', '')) || 0;
                            return timeB - timeA;
                        });
                        renderStoryList(stories);
                    }
                };
            } catch (err) {
                console.error(err);
                document.getElementById('storyListContainer').innerHTML = `<div style="text-align: center; color: #d95a52; font-size: 13px; margin-top: 40px;">Không thể tải dữ liệu truyện!</div>`;
            }
        }

        function renderStoryList(stories) {
            const container = document.getElementById('storyListContainer');

            if (stories.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #666; font-size: 13px; margin-top: 40px;">Chưa có bộ truyện nào.<br>Hãy bấm "Thêm truyện mới" để bắt đầu!</div>`;
                return;
            }

            container.innerHTML = stories.map(story => `
                <div class="story-card">
                    <img src="${story.cover}" alt="Bìa" class="story-cover" onclick="selectStory('${story.id}')">
                    <div class="story-info" onclick="selectStory('${story.id}')">
                        <h2 class="story-name">${story.name}</h2>
                        <p class="story-author">Tác giả: ${story.author}</p>
                        <span class="story-tag">${story.tag}</span>
                    </div>
                    <button class="delete-story-btn" onclick="deleteStory(event, '${story.id}', '${story.name.replace(/'/g, "\\'")}')" title="Xóa truyện">🗑️</button>
                </div>
            `).join('');
        }

        function selectStory(id) {
            localStorage.setItem('currentStoryId', id);
            window.location.href = 'detail.html';
        }

        // --- HÀM XÓA TRUYỆN ---
        async function deleteStory(event, storyId, storyName) {
            event.stopPropagation(); // Ngăn không cho sự kiện click nhầm vào thẻ card chuyển trang

            if (confirm(`Bạn có chắc chắn muốn xóa bộ truyện "${storyName}" không?`)) {
                try {
                    let db = await openDB();
                    let tx = db.transaction('stories', 'readwrite');
                    let store = tx.objectStore('stories');
                    store.delete(storyId);

                    tx.oncomplete = function() {
                        loadStoriesFromDB(); // Tải lại danh sách sau khi xóa
                    };
                    tx.onerror = function() {
                        alert('Không thể xóa truyện!');
                    };
                } catch (err) {
                    alert('Lỗi kết nối cơ sở dữ liệu!');
                }
            }
        }

        // --- XUẤT / NHẬP DỮ LIỆU BACKUP ---
        async function exportData() {
            let db = await openDB();
            let tx = db.transaction('stories', 'readonly');
            let store = tx.objectStore('stories');
            let request = store.getAll();

            request.onsuccess = function(e) {
                let data = { stories: e.target.result || [] };
                let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
                let downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "audiotruyen_backup_" + Date.now() + ".json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        async function importData(event) {
            let file = event.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    let imported = JSON.parse(e.target.result);
                    if (imported.stories) {
                        let db = await openDB();
                        let tx = db.transaction('stories', 'readwrite');
                        let store = tx.objectStore('stories');
                        
                        imported.stories.forEach(story => store.put(story));

                        tx.oncomplete = function() {
                            loadStoriesFromDB();
                            alert('Khôi phục dữ liệu thành công!');
                        };
                    } else {
                        alert('File dữ liệu không hợp lệ!');
                    }
                } catch (err) {
                    alert('Lỗi đọc file dữ liệu!');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
