<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trang chủ - Audio Truyện</title>
    <style>
        :root {
            --bg-color: #121212; --text-color: #fff; --card-bg: #1e1e22;
            --accent-color: #d95a52; --sub-text: #888; --border-color: #333;
        }
        body.light-theme {
            --bg-color: #f4f4f5; --text-color: #18181b; --card-bg: #ffffff;
            --sub-text: #666; --border-color: #d1d5db;
        }
        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 15px; box-sizing: border-box; max-width: 480px; margin: 0 auto;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .search-container { display: flex; align-items: center; gap: 10px; width: 100%; }
        .search-bar {
            flex: 1; background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 10px 14px; border-radius: 20px; color: var(--text-color); font-size: 13px; height: 40px; box-sizing: border-box; outline: none;
        }
        .icon-btn {
            background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color);
            width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; box-sizing: border-box; flex-shrink: 0; font-size: 18px;
        }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .story-card {
            display: flex; gap: 12px; background: var(--card-bg); padding: 12px; border-radius: 14px;
            text-decoration: none; color: var(--text-color); margin-bottom: 12px; border: 1px solid var(--border-color);
            cursor: pointer; transition: transform 0.2s;
        }
        .story-card:hover { transform: translateY(-2px); border-color: var(--accent-color); }
        .story-thumbnail { width: 75px; height: 100px; border-radius: 8px; object-fit: cover; }
        .story-info { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .story-name { font-size: 15px; font-weight: 700; margin: 0; }
        .story-desc { font-size: 12px; color: var(--sub-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .empty-notice { text-align: center; color: var(--sub-text); font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Tìm kiếm truyện audio...">
            <a href="add-story.html" class="icon-btn" title="Thêm truyện mới">+</a>
            <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Đổi giao diện">☼</button>
        </div>
    </div>

    <div class="section-title">Danh sách truyện của bạn</div>
    <div id="storyListContainer"></div>

    <script>
        function initData() {
            if (!localStorage.getItem('app_stories')) {
                localStorage.setItem('app_stories', JSON.stringify([]));
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        function openDetail(storyId) {
            localStorage.setItem('currentStoryId', storyId);
            window.location.href = 'detail.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            initData();
            if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');

            const stories = JSON.parse(localStorage.getItem('app_stories')) || [];
            const container = document.getElementById('storyListContainer');

            if (stories.length === 0) {
                container.innerHTML = `<div class="empty-notice">Chưa có truyện nào. Bấm nút dấu cộng (+) ở góc trên để thêm truyện mới nhé!</div>`;
                return;
            }

            container.innerHTML = stories.map(story => `
                <div class="story-card" onclick="openDetail('${story.id}')">
                    <img src="${story.cover || 'https://via.placeholder.com/300x400/222222/D95A52?text=Bia'}" alt="${story.name}" class="story-thumbnail">
                    <div class="story-info">
                        <h3 class="story-name">${story.name}</h3>
                        <span style="font-size: 11px; color: var(--accent-color);">${story.tag || 'Chưa phân loại'} • ${story.episodes ? story.episodes.length : 0} tập</span>
                        <p class="story-desc">${story.summary || 'Không có tóm tắt'}</p>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
