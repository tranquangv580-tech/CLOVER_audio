<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thêm truyện mới</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 16px; max-width: 480px; margin: 0 auto; box-sizing: border-box; }
        .back-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; text-decoration: none; display: inline-block; margin-bottom: 16px; }
        .page-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 12px; color: #aaa; display: block; margin-bottom: 6px; }
        .form-input, .form-textarea { width: 100%; background: #1c1c24; border: 1px solid #2d2d38; color: #fff; padding: 10px; border-radius: 8px; font-size: 13px; box-sizing: border-box; outline: none; }
        .form-textarea { resize: vertical; height: 90px; }
        .form-input:focus, .form-textarea:focus { border-color: #d95a52; }

        .submit-btn { width: 100%; background: #d95a52; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px; }
        .submit-btn:hover { background: #e06d67; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&#8592; Quay lại</a>
    <div class="page-title">Thêm bộ truyện mới</div>

    <div class="form-group">
        <label class="form-label">Tên truyện</label>
        <input type="text" class="form-input" id="storyNameInput" placeholder="Nhập tên truyện...">
    </div>

    <div class="form-group">
        <label class="form-label">Tác giả</label>
        <input type="text" class="form-input" id="storyAuthorInput" placeholder="Nhập tên tác giả...">
    </div>

    <div class="form-group">
        <label class="form-label">Thể loại / Thẻ</label>
        <input type="text" class="form-input" id="storyTagInput" placeholder="VD: Tiên Hiệp, Ngôn Tình...">
    </div>

    <div class="form-group">
        <label class="form-label">Ảnh bìa truyện (Tự động tối ưu dung lượng)</label>
        <input type="file" class="form-input" id="storyCoverInput" accept="image/*">
    </div>

    <div class="form-group">
        <label class="form-label">Tóm tắt nội dung</label>
        <textarea class="form-textarea" id="storySummaryInput" placeholder="Nhập tóm tắt sơ lược về truyện..."></textarea>
    </div>

    <button class="submit-btn" onclick="saveNewStory()">Lưu bộ truyện</button>

    <script>
        // Hàm tự động nén ảnh bìa về kích thước chuẩn (chiều rộng tối đa 300px) để không bao giờ bị tràn bộ nhớ
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 300; // Giới hạn chiều rộng tối ưu cho ảnh bìa
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Xuất ra định dạng JPEG với chất lượng 0.7 (giảm dung lượng cực mạnh nhưng vẫn rất nét)
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function saveNewStory() {
            const name = document.getElementById('storyNameInput').value.trim();
            const author = document.getElementById('storyAuthorInput').value.trim();
            const tag = document.getElementById('storyTagInput').value.trim();
            const summary = document.getElementById('storySummaryInput').value.trim();
            const coverInput = document.getElementById('storyCoverInput');

            if (!name) {
                alert('Vui lòng nhập tên truyện!');
                return;
            }

            let coverUrl = 'https://via.placeholder.com/120x165/333/fff?text=No+Cover';

            if (coverInput.files && coverInput.files[0]) {
                // Gọi hàm nén ảnh tự động trước khi lưu
                coverUrl = await compressImage(coverInput.files[0]);
            }

            const newStory = {
                id: 'story_' + Date.now(),
                name: name,
                author: author || 'Đang cập nhật',
                tag: tag || 'Truyện Audio',
                summary: summary || 'Chưa có tóm tắt.',
                cover: coverUrl,
                episodes: []
            };

            try {
                let stories = JSON.parse(localStorage.getItem('app_stories')) || [];
                stories.unshift(newStory);
                localStorage.setItem('app_stories', JSON.stringify(stories));

                alert('Thêm truyện mới thành công!');
                window.location.href = 'index.html';
            } catch (error) {
                alert('Có lỗi xảy ra, vui lòng thử lại!');
            }
        }
    </script>
</body>
</html>
