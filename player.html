<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Phát Audio Truyện</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="h-full font-sans transition-colors duration-300 bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 flex flex-col">

    <header class="w-full px-4 py-3 flex items-center justify-between border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <a href="detail.html" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
            <i class="fa-solid fa-arrow-left text-slate-600 dark:text-slate-300"></i>
        </a>
        <div class="text-center">
            <span class="text-xs uppercase tracking-wider text-indigo-500 font-semibold block">Đang Phát</span>
            <h1 id="header-story-title" class="text-sm font-bold truncate max-w-[200px]">Tên truyện</h1>
        </div>
        <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors shadow-sm">
            <i id="theme-icon" class="fa-solid fa-moon text-indigo-500"></i>
        </button>
    </header>

    <main class="flex-1 overflow-y-auto px-4 py-6 max-w-md mx-auto w-full flex flex-col justify-between">
        
        <!-- Cover Art & Info Section -->
        <div class="flex flex-col items-center text-center my-auto">
            <!-- Cover Card with Cloud/Star thematic backdrop -->
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 rounded-3xl overflow-hidden shadow-2xl mb-6 group border-4 border-white dark:border-slate-800 bg-gradient-to-br from-indigo-400 to-purple-500 dark:from-indigo-950 dark:to-slate-900 flex items-center justify-center">
                <!-- Theme background decor elements -->
                <div class="absolute inset-0 opacity-20 pointer-events-none">
                    <div class="absolute top-4 left-6 text-white text-xl animate-pulse">✨</div>
                    <div class="absolute bottom-8 right-8 text-white text-2xl">☁️</div>
                    <div class="absolute top-1/2 right-4 text-white text-lg">⭐</div>
                </div>
                <img id="cover-art" src="https://placehold.co/400x400/6366f1/ffffff?text=TruyenAudio" alt="Cover Art" class="w-full h-full object-cover rounded-2xl transform transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/400x400/6366f1/ffffff?text=Audio'">
            </div>

            <h2 id="current-episode-title" class="text-xl font-bold mb-1 text-slate-900 dark:text-white px-2">Tập 1: Khởi đầu mới</h2>
            <p id="current-story-author" class="text-sm text-slate-500 dark:text-slate-400">Tác giả đang cập nhật</p>
        </div>

        <!-- Progress & Controls Section -->
        <div class="w-full mt-6 space-y-4">
            <!-- Audio Progress Bar -->
            <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 font-medium">
                    <span id="current-time">00:00</span>
                    <span id="total-duration">00:00</span>
                </div>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1" 
                    class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>

            <!-- Main Player Buttons -->
            <div class="flex items-center justify-between px-4">
                <!-- Speed Control Trigger -->
                <button id="speed-btn" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors text-indigo-600 dark:text-indigo-400">
                    1.0x
                </button>

                <div class="flex items-center space-x-6">
                    <button id="prev-btn" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <i class="fa-solid fa-backward-step text-lg"></i>
                    </button>
                    <button id="play-pause-btn" class="w-16 h-16 rounded-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white flex items-center justify-center shadow-lg shadow-indigo-500/30 hover:scale-105 active:scale-95 transition-all">
                        <i id="play-icon" class="fa-solid fa-play text-2xl ml-1"></i>
                    </button>
                    <button id="next-btn" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <i class="fa-solid fa-forward-step text-lg"></i>
                    </button>
                </div>

                <!-- Timer / Sleep Timer Trigger -->
                <button id="timer-btn" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors text-slate-600 dark:text-slate-300 relative">
                    <i class="fa-solid fa-moon text-base"></i>
                    <span id="timer-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-indigo-500 text-white text-[10px] rounded-full hidden items-center justify-center font-bold">!</span>
                </button>
            </div>
        </div>

        <!-- Episode Playlist Section -->
        <div class="mt-8 border-t border-slate-200 dark:border-slate-800 pt-4">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-list-ul text-indigo-500"></i> Danh sách tập
                </h3>
                <span id="episode-count" class="text-xs px-2 py-0.5 bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 rounded-full font-medium">0 tập</span>
            </div>
            <!-- Scrollable Episodes list -->
            <div id="playlist-container" class="max-h-48 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                <!-- Dynamic loaded items -->
            </div>
        </div>

    </main>

    <!-- Speed Modal -->
    <div id="speed-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full sm:max-w-xs rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
            <h3 class="text-base font-bold mb-4 text-center">Tốc độ phát</h3>
            <div class="grid grid-cols-3 gap-2" id="speed-options">
                <button data-speed="0.75" class="py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium hover:bg-indigo-50 dark:hover:bg-indigo-950 hover:border-indigo-500 transition-all">0.75x</button>
                <button data-speed="1.0" class="py-2.5 rounded-xl border border-indigo-500 bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 text-sm font-bold transition-all">1.0x</button>
                <button data-speed="1.25" class="py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium hover:bg-indigo-50 dark:hover:bg-indigo-950 hover:border-indigo-500 transition-all">1.25x</button>
                <button data-speed="1.5" class="py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium hover:bg-indigo-50 dark:hover:bg-indigo-950 hover:border-indigo-500 transition-all">1.5x</button>
                <button data-speed="2.0" class="py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium hover:bg-indigo-50 dark:hover:bg-indigo-950 hover:border-indigo-500 transition-all">2.0x</button>
            </div>
        </div>
    </div>

    <!-- Timer Modal -->
    <div id="timer-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full sm:max-w-xs rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
            <h3 class="text-base font-bold mb-4 text-center">Hẹn giờ dừng phát</h3>
            <div class="space-y-2" id="timer-options">
                <button data-minutes="0" class="w-full py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium hover:bg-indigo-50 dark:hover:bg-indigo-950 transition-all">Tắt hẹn giờ</button>
                <button data-minutes="15" class="w-full py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium hover:bg-indigo-50 dark:hover:bg-indigo-950 transition-all">Sau 15 phút</button>
                <button data-minutes="30" class="w-full py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium hover:bg-indigo-50 dark:hover:bg-indigo-950 transition-all">Sau 30 phút</button>
                <button data-minutes="60" class="w-full py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium hover:bg-indigo-50 dark:hover:bg-indigo-950 transition-all">Sau 60 phút</button>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-element" preload="auto"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            const htmlElement = document.documentElement;

            // Theme setup (Đêm sao/Mặt trăng & Ngày/Mây)
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'dark') {
                htmlElement.classList.add('dark');
                themeIcon.className = 'fa-solid fa-moon text-indigo-400';
            } else {
                htmlElement.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-sun text-amber-500';
            }

            themeToggleBtn.addEventListener('click', () => {
                htmlElement.classList.toggle('dark');
                if (htmlElement.classList.contains('dark')) {
                    localStorage.setItem('theme', 'dark');
                    themeIcon.className = 'fa-solid fa-moon text-indigo-400';
                } else {
                    localStorage.setItem('theme', 'light');
                    themeIcon.className = 'fa-solid fa-sun text-amber-500';
                }
            });

            // Audio Player Logic & State
            const audioElement = document.getElementById('audio-element');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playIcon = document.getElementById('play-icon');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const totalDurationEl = document.getElementById('total-duration');
            
            const headerTitle = document.getElementById('header-story-title');
            const currentEpTitle = document.getElementById('current-episode-title');
            const currentAuthor = document.getElementById('current-story-author');
            const coverArt = document.getElementById('cover-art');
            const playlistContainer = document.getElementById('playlist-container');
            const episodeCountEl = document.getElementById('episode-count');

            // Modals elements
            const speedBtn = document.getElementById('speed-btn');
            const speedModal = document.getElementById('speed-modal');
            const speedOptions = document.querySelectorAll('#speed-options button');

            const timerBtn = document.getElementById('timer-btn');
            const timerModal = document.getElementById('timer-modal');
            const timerOptions = document.querySelectorAll('#timer-options button');
            const timerBadge = document.getElementById('timer-badge');

            let currentEpisodes = [];
            let currentIndex = 0;
            let sleepTimerTimeout = null;

            // Load data passed from Detail page or default state
            function initPlayer() {
                const dataParam = localStorage.getItem('current_story_play');
                if (dataParam) {
                    try {
                        const storyData = JSON.parse(dataParam);
                        headerTitle.textContent = storyData.title || 'Truyện Audio';
                        currentAuthor.textContent = storyData.author || 'Tác giả ẩn danh';
                        coverArt.src = storyData.cover || 'https://placehold.co/400x400/6366f1/ffffff?text=TruyenAudio';
                        
                        currentEpisodes = storyData.episodes || [
                            { title: 'Tập 1: Phần Mở Đầu', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' }
                        ];
                        currentIndex = storyData.startIndex || 0;
                    } catch (e) {
                        loadDefaultEpisodes();
                    }
                } else {
                    loadDefaultEpisodes();
                }

                renderPlaylist();
                loadEpisode(currentIndex);
            }

            function loadDefaultEpisodes() {
                headerTitle.textContent = "Hành Trình Đêm Sao";
                currentAuthor.textContent = "Sưu Tầm";
                currentEpisodes = [
                    { title: 'Tập 1: Dưới ánh trăng bạc', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
                    { title: 'Tập 2: Giai điệu mây trắng', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
                    { title: 'Tập 3: Bầu trời đầy sao', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' }
                ];
                currentIndex = 0;
            }

            function renderPlaylist() {
                playlistContainer.innerHTML = '';
                episodeCountEl.textContent = `${currentEpisodes.length} tập`;
                
                currentEpisodes.forEach((ep, index) => {
                    const item = document.createElement('div');
                    item.className = `flex items-center justify-between p-3 rounded-xl cursor-pointer transition-colors ${index === currentIndex ? 'bg-indigo-500/10 border border-indigo-500/30 text-indigo-600 dark:text-indigo-400 font-semibold' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300'}`;
                    item.innerHTML = `
                        <div class="flex items-center space-x-3 truncate">
                            <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs bg-slate-200 dark:bg-slate-800">${index + 1}</span>
                            <span class="text-sm truncate">${ep.title}</span>
                        </div>
                        <i class="fa-solid ${index === currentIndex ? 'fa-volume-high' : 'fa-play'} text-xs opacity-60"></i>
                    `;
                    item.addEventListener('click', () => {
                        currentIndex = index;
                        loadEpisode(currentIndex);
                        audioElement.play();
                        updatePlayState(true);
                        renderPlaylist();
                    });
                    playlistContainer.appendChild(item);
                });
            }

            function loadEpisode(index) {
                if (currentEpisodes.length === 0) return;
                const ep = currentEpisodes[index];
                currentEpTitle.textContent = ep.title;
                audioElement.src = ep.url || 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
                progressBar.value = 0;
                currentTimeEl.textContent = '00:00';
            }

            // Play / Pause Controls
            playPauseBtn.addEventListener('click', () => {
                if (audioElement.paused) {
                    audioElement.play();
                    updatePlayState(true);
                } else {
                    audioElement.pause();
                    updatePlayState(false);
                }
            });

            function updatePlayState(isPlaying) {
                if (isPlaying) {
                    playIcon.className = 'fa-solid fa-pause text-2xl';
                } else {
                    playIcon.className = 'fa-solid fa-play text-2xl ml-1';
                }
            }

            document.getElementById('prev-btn').addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    loadEpisode(currentIndex);
                    audioElement.play();
                    updatePlayState(true);
                    renderPlaylist();
                }
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                if (currentIndex < currentEpisodes.length - 1) {
                    currentIndex++;
                    loadEpisode(currentIndex);
                    audioElement.play();
                    updatePlayState(true);
                    renderPlaylist();
                }
            });

            // Audio Progress updates
            audioElement.addEventListener('timeupdate', () => {
                if (!isNaN(audioElement.duration)) {
                    const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                    progressBar.value = progressPercent;
                    currentTimeEl.textContent = formatTime(audioElement.currentTime);
                    totalDurationEl.textContent = formatTime(audioElement.duration);
                }
            });

            progressBar.addEventListener('input', () => {
                if (!isNaN(audioElement.duration)) {
                    const seekTime = (progressBar.value / 100) * audioElement.duration;
                    audioElement.currentTime = seekTime;
                }
            });

            audioElement.addEventListener('ended', () => {
                if (currentIndex < currentEpisodes.length - 1) {
                    currentIndex++;
                    loadEpisode(currentIndex);
                    audioElement.play();
                    renderPlaylist();
                } else {
                    updatePlayState(false);
                }
            });

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // Speed Modal Controls
            speedBtn.addEventListener('click', () => speedModal.classList.remove('hidden'));
            speedModal.addEventListener('click', (e) => {
                if (e.target === speedModal) speedModal.classList.add('hidden');
            });

            speedOptions.forEach(btn => {
                btn.addEventListener('click', () => {
                    const speed = parseFloat(btn.dataset.speed);
                    audioElement.playbackRate = speed;
                    speedBtn.textContent = `${speed}x`;
                    speedModal.classList.add('hidden');
                    
                    speedOptions.forEach(b => b.classList.remove('border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-950', 'text-indigo-600', 'dark:text-indigo-400', 'font-bold'));
                    btn.classList.add('border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-950', 'text-indigo-600', 'dark:text-indigo-400', 'font-bold');
                });
            });

            // Timer Modal Controls
            timerBtn.addEventListener('click', () => timerModal.classList.remove('hidden'));
            timerModal.addEventListener('click', (e) => {
                if (e.target === timerModal) timerModal.classList.add('hidden');
            });

            timerOptions.forEach(btn => {
                btn.addEventListener('click', () => {
                    const minutes = parseInt(btn.dataset.minutes);
                    if (sleepTimerTimeout) clearTimeout(sleepTimerTimeout);

                    if (minutes > 0) {
                        timerBadge.classList.remove('hidden');
                        timerBadge.classList.add('flex');
                        sleepTimerTimeout = setTimeout(() => {
                            audioElement.pause();
                            updatePlayState(false);
                            timerBadge.classList.add('hidden');
                            timerBadge.classList.remove('flex');
                        }, minutes * 60 * 1000);
                    } else {
                        timerBadge.classList.add('hidden');
                        timerBadge.classList.remove('flex');
                    }
                    timerModal.classList.add('hidden');
                });
            });

            // Initialize on start
            initPlayer();
        });
    </script>
</body>
</html>
