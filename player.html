<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Màn Hình Nghe</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f0f13; color: #fff; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; max-width: 480px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 16px; background: transparent; z-index: 10; }
        .back-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; backdrop-filter: blur(10px); text-decoration: none; }
        .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
        .header-title { font-size: 14px; font-weight: 600; color: #aaa; letter-spacing: 0.5px; }

        /* KHU VỰC ẢNH BÌA LỚN */
        .cover-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 0 40px; }
        .player-cover { width: 100%; max-width: 280px; aspect-ratio: 1; object-fit: cover; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); background: #222; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        /* Hiệu ứng khi phát nhạc hơi nảy lên */
        .playing .player-cover { transform: scale(1.03); box-shadow: 0 25px 50px rgba(217, 90, 82, 0.2); }

        /* KHU VỰC THÔNG TIN */
        .info-section { padding: 0 24px; margin-bottom: 25px; text-align: center; }
        .episode-title { font-size: 22px; font-weight: 700; margin: 0 0 8px 0; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
        .story-name { font-size: 15px; color: #aaa; margin: 0; }

        /* THANH TIẾN TRÌNH YOUTUBE STYLE */
        .progress-wrapper { padding: 0 24px; margin-bottom: 25px; }
        .progress-container { width: 100%; height: 24px; display: flex; align-items: center; cursor: pointer; position: relative; }
        .progress-bar { -webkit-appearance: none; width: 100%; height: 4px; background: #333; border-radius: 2px; outline: none; transition: height 0.2s ease; cursor: pointer; }
        .progress-container:hover .progress-bar, .progress-container:active .progress-bar { height: 6px; }
        
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff0000; cursor: pointer; opacity: 0; transition: opacity 0.2s, transform 0.1s; transform: scale(1); box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .progress-container:hover .progress-bar::-webkit-slider-thumb, .progress-bar:active::-webkit-slider-thumb { opacity: 1; transform: scale(1.2); }
        
        .time-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #888; font-weight: 500; font-variant-numeric: tabular-nums; }

        /* CỤM NÚT ĐIỀU KHIỂN TRUNG TÂM */
        .controls { display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 30px; }
        .ctrl-btn { background: none; border: none; padding: 0; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); fill: #fff; }
        .ctrl-btn:active { transform: scale(0.85); opacity: 0.8; }
        
        /* Chỉnh riêng nút lùi/tiến */
        .skip-icon { width: 36px; height: 36px; fill: #ddd; }
        
        /* Nút Play to, đổ bóng đỏ */
        .play-btn { width: 72px; height: 72px; background: #d95a52; border-radius: 50%; box-shadow: 0 8px 25px rgba(217, 90, 82, 0.5); position: relative; }
        .play-btn:active { transform: scale(0.9); box-shadow: 0 4px 15px rgba(217, 90, 82, 0.3); }
        .play-icon { width: 28px; height: 28px; fill: #fff; margin-left: 4px; /* Cân bằng tam giác */ }
        .pause-icon { width: 28px; height: 28px; fill: #fff; display: none; }
        .playing .play-icon { display: none; }
        .playing .pause-icon { display: block; margin-left: 0; }

        /* CỤM CHỨC NĂNG PHỤ (TỐC ĐỘ, DS, HẸN GIỜ) */
        .bottom-actions { display: flex; justify-content: space-around; padding: 15px 20px 30px; background: linear-gradient(transparent, #0a0a0d); }
        .action-btn { background: #1a1a20; border: 1px solid #2a2a32; color: #ccc; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 30%; padding: 12px 0; border-radius: 16px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; gap: 6px; }
        .action-btn svg { width: 20px; height: 20px; fill: #ccc; transition: 0.2s; }
        .action-btn:active { background: #2a2a36; transform: scale(0.95); border-color: #d95a52; color: #fff; }
        .action-btn:active svg { fill: #d95a52; }

    </style>
</head>
<body id="playerBody">

    <div class="header">
        <a href="detail.html" class="back-btn">&#8595;</a>
        <div class="header-title">ĐANG PHÁT</div>
        <div style="width: 40px;"></div> </div>

    <div class="cover-container">
        <img src="https://via.placeholder.com/300" alt="Bìa Truyện" class="player-cover" id="playerCover">
    </div>

    <div class="info-section">
        <h2 class="episode-title" id="playerTitle">Đang tải tên tập...</h2>
        <p class="story-name" id="playerStoryName">Đang tải tên truyện...</p>
    </div>

    <div class="progress-wrapper">
        <div class="progress-container">
            <input type="range" min="0" max="100" value="0" class="progress-bar" id="progressBar">
        </div>
        <div class="time-row">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" onclick="skip(-10)" title="Lùi 10s">
            <svg class="skip-icon" viewBox="0 0 24 24"><path d="M12.5 3C17.15 3 21 6.85 21 11.5C21 16.15 17.15 20 12.5 20C9.07 20 6.09 18 4.54 15.17L5.43 14.73C6.72 17.07 9.42 18.78 12.5 18.78C16.5 18.78 19.78 15.5 19.78 11.5C19.78 7.5 16.5 4.22 12.5 4.22C9.43 4.22 6.74 5.92 5.45 8.24L7.86 8.24L7.86 9.46L3.33 9.46L3.33 4.93L4.55 4.93L4.55 7.15C6.26 4.5 9.2 2.78 12.5 2.78V3Z"/><text x="12" y="14" font-size="6" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#ddd">10</text></svg>
        </button>
        
        <button class="ctrl-btn play-btn" onclick="togglePlay()" id="playPauseBtn">
            <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        
        <button class="ctrl-btn" onclick="skip(10)" title="Tiến 10s">
            <svg class="skip-icon" viewBox="0 0 24 24"><path d="M11.5 3C6.85 3 3 6.85 3 11.5C3 16.15 6.85 20 11.5 20C14.93 20 17.91 18 19.46 15.17L18.57 14.73C17.28 17.07 14.58 18.78 11.5 18.78C7.5 18.78 4.22 15.5 4.22 11.5C4.22 7.5 7.5 4.22 11.5 4.22C14.57 4.22 17.26 5.92 18.55 8.24L16.14 8.24L16.14 9.46L20.67 9.46L20.67 4.93L19.45 4.93L19.45 7.15C17.74 4.5 14.8 2.78 11.5 2.78V3Z"/><text x="12" y="14" font-size="6" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#ddd">10</text></svg>
        </button>
    </div>

    <div class="bottom-actions">
        <div class="action-btn" onclick="cycleSpeed()" id="speedBtn">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            <span id="speedText">1.0x</span>
        </div>
        <div class="action-btn" onclick="window.location.href='detail.html'">
            <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            <span>Danh sách</span>
        </div>
        <div class="action-btn" onclick="alert('Tính năng hẹn giờ sẽ được mở trong cập nhật tới!')">
            <svg viewBox="0 0 24 24"><path d="M22 5.72l-4.6-3.86-1.29 1.53 4.6 3.86L22 5.72zM7.88 3.39L6.6 1.86 2 5.71l1.29 1.53 4.59-3.85zM12.5 8H11v6l4.75 2.85.75-1.23-4-2.37V8zM12 4c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/></svg>
            <span>Hẹn giờ</span>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const progressBar = document.getElementById('progressBar');
        const playBtn = document.getElementById('playPauseBtn');
        const playerBody = document.getElementById('playerBody');
        
        let speeds = [1.0, 1.25, 1.5, 2.0, 0.75];
        let currentSpeedIdx = 0;

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        async function initPlayer() {
            let storyId = localStorage.getItem('currentStoryId');
            let episodeTitle = localStorage.getItem('currentEpisodeTitle');
            let audioKey = localStorage.getItem('currentAudioKey');

            document.getElementById('playerTitle').textContent = episodeTitle || "Tập không xác định";

            // Lấy thông tin cover và truyện từ DB
            let db = await new Promise((resolve) => {
                let req = indexedDB.open('AudioBookDB', 2);
                req.onsuccess = e => resolve(e.target.result);
            });

            let txStory = db.transaction('stories', 'readonly');
            let storyReq = txStory.objectStore('stories').get(storyId);
            storyReq.onsuccess = (e) => {
                let story = e.target.result;
                if(story) {
                    document.getElementById('playerStoryName').textContent = story.name;
                    document.getElementById('playerCover').src = story.cover || 'https://via.placeholder.com/300';
                }
            };

            // Lấy Audio blob
            let txAudio = db.transaction('audios', 'readonly');
            let audioReq = txAudio.objectStore('audios').get(audioKey);
            audioReq.onsuccess = (e) => {
                let blob = e.target.result;
                if(blob) {
                    audio.src = URL.createObjectURL(blob);
                    // Có thể auto play tại đây nếu muốn: audio.play();
                } else {
                    alert("Không tìm thấy file âm thanh.");
                }
            };
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        audio.addEventListener('play', () => playerBody.classList.add('playing'));
        audio.addEventListener('pause', () => playerBody.classList.remove('playing'));

        audio.addEventListener('loadedmetadata', () => {
            document.getElementById('totalTime').textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                let percent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percent;
                // Cập nhật background đỏ kiểu youtube cho thanh trượt
                progressBar.style.background = `linear-gradient(to right, #ff0000 ${percent}%, #333 ${percent}%)`;
                document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
            }
        });

        progressBar.addEventListener('input', (e) => {
            let seekTime = (e.target.value / 100) * audio.duration;
            audio.currentTime = seekTime;
            progressBar.style.background = `linear-gradient(to right, #ff0000 ${e.target.value}%, #333 ${e.target.value}%)`;
        });

        function skip(seconds) {
            audio.currentTime += seconds;
        }

        function cycleSpeed() {
            currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
            let speed = speeds[currentSpeedIdx];
            audio.playbackRate = speed;
            document.getElementById('speedText').textContent = speed + "x";
        }

        window.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
