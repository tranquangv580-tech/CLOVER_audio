<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình Phát Audio</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; max-width: 480px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; }
        
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; text-decoration: none; }
        
        /* Phần hiển thị bìa và tên */
        .player-header { text-align: center; }
        .player-cover { width: 140px; height: 190px; border-radius: 12px; object-fit: cover; margin: 0 auto 15px auto; border: 1px solid #333; box-shadow: 0 6px 16px rgba(0,0,0,0.6); display: block; }
        .story-title-text { font-size: 14px; color: #aaa; margin: 0 0 4px 0; }
        .episode-title-text { font-size: 18px; font-weight: 700; margin: 0; color: #fff; }

        /* Thanh tiến trình giống YouTube */
        .progress-container { margin: 25px 0 10px 0; }
        .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; outline: none; cursor: pointer; accent-color: #d95a52; }
        .time-row { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-top: 6px; }

        /* Các nút điều khiển chính (Play/Pause, Tua ±10s) */
        .main-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
        .control-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 10px; transition: 0.2s; }
        .control-btn:hover { color: #d95a52; }
        .play-pause-btn { background: #d95a52; color: #fff; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px rgba(217,90,82,0.4); transition: 0.2s; }
        .play-pause-btn:hover { transform: scale(1.05); background: #e06d67; }

        /* Các nút phụ bên dưới (Hẹn giờ, Tốc độ, Danh sách chương) */
        .sub-controls-row { display: flex; justify-content: space-around; background: #19191e; border: 1px solid #25252c; padding: 12px; border-radius: 12px; margin-top: 10px; }
        .sub-btn { background: none; border: none; color: #ccc; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .sub-btn span { font-size: 16px; }
        .sub-btn:hover { color: #d95a52; }

        /* Popup / Bottom Sheet chung */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s; backdrop-filter: blur(4px); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .bottom-sheet { position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background-color: #1a1a1e; border-radius: 24px 24px 0 0; padding: 20px; box-sizing: border-box; z-index: 1001; transition: bottom 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); max-height: 70vh; display: flex; flex-direction: column; }
        .bottom-sheet.active { bottom: 0; }
        
        .popup-option { background: #24242c; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; margin-bottom: 8px; transition: 0.2s; }
        .popup-option:hover { background: #2e2e38; border-color: #d95a52; color: #d95a52; }
        
        .chapter-list-scroll { overflow-y: auto; max-height: 45vh; margin-top: 10px; padding-right: 4px; display: flex; flex-direction: column; gap: 6px; }
        .chapter-list-scroll::-webkit-scrollbar { width: 4px; }
        .chapter-list-scroll::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .chapter-item { background: #24242c; padding: 10px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid #333; text-align: left; }
        .chapter-item:hover { border-color: #d95a52; background: #2e2e38; }
        .chapter-item.active { border-color: #d95a52; color: #d95a52; background: rgba(217,90,82,0.1); }
    </style>
</head>
<body>

    <div class="top-row">
        <a href="detail.html" class="back-btn">&#8592; Quay lại</a>
        <span style="font-size: 14px; color: #d95a52; font-weight: 600;">Đang phát</span>
        <div style="width: 24px;"></div>
    </div>

    <div class="player-header">
        <img id="playerCoverImg" src="" alt="Bìa truyện" class="player-cover">
        <div class="story-title-text" id="playerStoryName">Tên tiểu thuyết</div>
        <h1 class="episode-title-text" id="playerEpisodeTitle">Đang tải...</h1>
    </div>

    <div class="player-body">
        <div class="progress-container">
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100" step="0.1">
            <div class="time-row">
                <span id="currentTimeText">00:00</span>
                <span id="durationText">00:00</span>
            </div>
        </div>

        <div class="main-controls">
            <button class="control-btn" onclick="skipTime(-10)" title="Tua lùi 10 giây">⏪ 10s</button>
            <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()">▶</button>
            <button class="control-btn" onclick="skipTime(10)" title="Tua tới 10 giây">10s ⏩</button>
        </div>

        <div class="sub-controls-row">
            <button class="sub-btn" onclick="openTimerModal()"><span>⏱️</span>Hẹn giờ</button>
            <button class="sub-btn" onclick="openSpeedModal()"><span id="speedIndicator">1.0x</span>Tốc độ</button>
            <button class="sub-btn" onclick="openChapterModal()"><span>📑</span>Chương</button>
        </div>
    </div>

    <audio id="audioElement" style="display: none;"></audio>

    <div class="modal-overlay" id="timerModalOverlay" onclick="closeTimerModal()"></div>
    <div class="bottom-sheet" id="timerModalSheet">
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center;">
            <strong style="font-size: 15px;">Hẹn giờ tắt audio</strong>
            <span style="cursor: pointer; font-size: 20px; color: #aaa;" onclick="closeTimerModal()">&times;</span>
        </div>
        <div class="popup-option" onclick="setSleepTimer(15)">15 phút</div>
        <div class="popup-option" onclick="setSleepTimer(30)">30 phút</div>
        <div class="popup-option" onclick="setSleepTimer(45)">45 phút</div>
        <div class="popup-option" onclick="setSleepTimer(60)">60 phút</div>
        <div class="popup-option" onclick="setSleepTimer(0)" style="color: #d95a52;">Tắt hẹn giờ</div>
    </div>

    <div class="modal-overlay" id="speedModalOverlay" onclick="closeSpeedModal()"></div>
    <div class="bottom-sheet" id="speedModalSheet">
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center;">
            <strong style="font-size: 15px;">Chọn tốc độ phát</strong>
            <span style="cursor: pointer; font-size: 20px; color: #aaa;" onclick="closeSpeedModal()">&times;</span>
        </div>
        <div class="popup-option" onclick="setPlaybackSpeed(0.75)">0.75x</div>
        <div class="popup-option" onclick="setPlaybackSpeed(1.0)">1.0x (Bình thường)</div>
        <div class="popup-option" onclick="setPlaybackSpeed(1.25)">1.25x</div>
        <div class="popup-option" onclick="setPlaybackSpeed(1.5)">1.5x</div>
        <div class="popup-option" onclick="setPlaybackSpeed(2.0)">2.0x</div>
    </div>

    <div class="modal-overlay" id="chapterModalOverlay" onclick="closeChapterModal()"></div>
    <div class="bottom-sheet" id="chapterModalSheet">
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center;">
            <strong style="font-size: 15px;">Danh sách tập trong truyện</strong>
            <span style="cursor: pointer; font-size: 20px; color: #aaa;" onclick="closeChapterModal()">&times;</span>
        </div>
        <div class="chapter-list-scroll" id="chapterListContainer">
            </div>
    </div>

    <script>
        const episodeTitle = localStorage.getItem('currentEpisodeTitle') || 'Tập Audio';
        const audioKey = localStorage.getItem('currentAudioKey') || '';
        const currentStoryId = localStorage.getItem('currentStoryId') || '';

        document.getElementById('playerEpisodeTitle').textContent = episodeTitle;

        let audio = document.getElementById('audioElement');
        let playPauseBtn = document.getElementById('playPauseBtn');
        let progressBar = document.getElementById('progressBar');
        let currentTimeText = document.getElementById('currentTimeText');
        let durationText = document.getElementById('durationText');
        
        let currentStoryData = null;
        let sleepTimerId = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('AudioBookDB', 2);
                request.onsuccess = e => resolve(e.target.result);
                request.onerror = e => reject(e.target.error);
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                let db = await openDB();
                
                // 1. Tải thông tin truyện để hiển thị ảnh bìa và tên truyện
                let txStory = db.transaction('stories', 'readonly');
                let storyStore = txStory.objectStore('stories');
                let storyReq = storyStore.get(currentStoryId);
                
                storyReq.onsuccess = function(e) {
                    currentStoryData = e.target.result;
                    if (currentStoryData) {
                        document.getElementById('playerStoryName').textContent = currentStoryData.name;
                        if (currentStoryData.cover) {
                            document.getElementById('playerCoverImg').src = currentStoryData.cover;
                        }
                    }
                };

                // 2. Tải file âm thanh từ kho audios
                let txAudio = db.transaction('audios', 'readonly');
                let audioStore = txAudio.objectStore('audios');

                if (audioKey && audioKey !== 'undefined' && audioKey !== 'null') {
                    let audioReq = audioStore.get(audioKey);
                    audioReq.onsuccess = function(e) {
                        let audioFile = e.target.result;
                        if (audioFile) {
                            loadAudioSource(audioFile);
                        } else {
                            fetchLatestAudio(audioStore);
                        }
                    };
                    audioReq.onerror = () => fetchLatestAudio(audioStore);
                } else {
                    fetchLatestAudio(audioStore);
                }
            } catch (err) {
                console.error(err);
            }
        });

        function fetchLatestAudio(store) {
            let allReq = store.getAll();
            allReq.onsuccess = function(e) {
                let audios = e.target.result;
                if (audios && audios.length > 0) {
                    loadAudioSource(audios[audios.length - 1]);
                }
            };
        }

        function loadAudioSource(audioFile) {
            let audioURL = URL.createObjectURL(audioFile);
            audio.src = audioURL;
            audio.load();
            audio.play().then(() => {
                playPauseBtn.textContent = '⏸';
            }).catch(err => {
                console.log("Trình duyệt chặn tự động phát:", err);
                playPauseBtn.textContent = '▶';
            });
        }

        // Xử lý Play / Pause
        function togglePlayPause() {
            if (audio.paused) {
                audio.play();
                playPauseBtn.textContent = '⏸';
            } else {
                audio.pause();
                playPauseBtn.textContent = '▶';
            }
        }

        // Cập nhật thanh tiến trình theo thời gian thực
        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                let progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeText.textContent = formatTime(audio.currentTime);
                durationText.textContent = formatTime(audio.duration);
            }
        });

        // Tua bằng cách kéo thanh Range
        progressBar.addEventListener('input', () => {
            if (!isNaN(audio.duration)) {
                let seekTime = (progressBar.value / 100) * audio.duration;
                audio.currentTime = seekTime;
            }
        });

        // Nút tua nhanh / lùi 10 giây
        function skipTime(seconds) {
            if (!isNaN(audio.duration)) {
                audio.currentTime = Math.min(Math.max(audio.currentTime + seconds, 0), audio.duration);
            }
        }

        // Format định dạng thời gian phút:giây
        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
        }

        // --- CÁC TÍNH NĂNG POPUP (Hẹn giờ, Tốc độ, Danh sách tập) ---

        // 1. Hẹn giờ
        function openTimerModal() {
            document.getElementById('timerModalOverlay').classList.add('active');
            document.getElementById('timerModalSheet').classList.add('active');
        }
        function closeTimerModal() {
            document.getElementById('timerModalOverlay').classList.remove('active');
            document.getElementById('timerModalSheet').classList.remove('active');
        }
        function setSleepTimer(minutes) {
            if (sleepTimerId) clearTimeout(sleepTimerId);
            closeTimerModal();
            if (minutes > 0) {
                alert(`Đã hẹn giờ tắt sau ${minutes} phút!`);
                sleepTimerId = setTimeout(() => {
                    audio.pause();
                    playPauseBtn.textContent = '▶';
                    alert('Đã tự động tắt audio theo hẹn giờ.');
                }, minutes * 60 * 1000);
            } else {
                alert('Đã hủy hẹn giờ tắt.');
            }
        }

        // 2. Tốc độ phát
        function openSpeedModal() {
            document.getElementById('speedModalOverlay').classList.add('active');
            document.getElementById('speedModalSheet').classList.add('active');
        }
        function closeSpeedModal() {
            document.getElementById('speedModalOverlay').classList.remove('active');
            document.getElementById('speedModalSheet').classList.remove('active');
        }
        function setPlaybackSpeed(speed) {
            audio.playbackRate = speed;
            document.getElementById('speedIndicator').textContent = speed + 'x';
            closeSpeedModal();
        }

        // 3. Danh sách chương / tập
        function openChapterModal() {
            renderChapterList();
            document.getElementById('chapterModalOverlay').classList.add('active');
            document.getElementById('chapterModalSheet').classList.add('active');
        }
        function closeChapterModal() {
            document.getElementById('chapterModalOverlay').classList.remove('active');
            document.getElementById('chapterModalSheet').classList.remove('active');
        }
        function renderChapterList() {
            let container = document.getElementById('chapterListContainer');
            if (currentStoryData && currentStoryData.episodes && currentStoryData.episodes.length > 0) {
                container.innerHTML = currentStoryData.episodes.map(ep => `
                    <div class="chapter-item ${ep.title === episodeTitle ? 'active' : ''}" onclick="switchEpisode('${ep.title}', '${ep.audioKey}')">
                        ${ep.title}
                    </div>
                `).join('');
            } else {
                container.innerHTML = `<div style="text-align: center; color: #888; font-size: 13px; padding: 20px;">Không có danh sách tập.</div>`;
            }
        }
        function switchEpisode(title, audioKey) {
            localStorage.setItem('currentEpisodeTitle', title);
            localStorage.setItem('currentAudioKey', audioKey);
            location.reload(); // Tải lại trang để phát tập mới được chọn
        }
    </script>
</body>
</html>
