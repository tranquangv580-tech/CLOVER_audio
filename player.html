<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phát Audio</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; max-width: 480px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        .top-row { display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; text-decoration: none; }
        
        .player-content { text-align: center; margin: auto 0; }
        .episode-title { font-size: 16px; font-weight: 700; margin-bottom: 30px; color: #fff; }
        
        audio { width: 100%; outline: none; margin-top: 20px; }
        .loading-text { color: #888; font-size: 13px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="top-row">
        <a href="detail.html" class="back-btn">&#8592; Quay lại</a>
        <span style="font-size: 14px; color: #d95a52; font-weight: 600;">Đang phát</span>
        <div style="width: 24px;"></div>
    </div>

    <div class="player-content">
        <div class="episode-title" id="playerEpisodeTitle">Đang tải tên tập...</div>
        <div class="loading-text" id="loadingStatus">Đang tải tệp âm thanh từ hệ thống...</div>
        
        <audio id="audioPlayer" controls style="display: none;"></audio>
    </div>

    <div style="text-align: center; font-size: 11px; color: #555; padding-bottom: 10px;">
        Hệ thống Audio Book
    </div>

    <script>
        const episodeTitle = localStorage.getItem('currentEpisodeTitle') || 'Tập Audio';
        const audioKey = localStorage.getItem('currentAudioKey') || '';

        document.getElementById('playerEpisodeTitle').textContent = episodeTitle;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('AudioBookDB', 2);
                request.onsuccess = e => resolve(e.target.result);
                request.onerror = e => reject(e.target.error);
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (!audioKey) {
                document.getElementById('loadingStatus').textContent = 'Chưa có tệp âm thanh được chỉ định!';
                return;
            }

            try {
                let db = await openDB();
                let tx = db.transaction('audios', 'readonly');
                let store = tx.objectStore('audios');
                let request = store.get(audioKey);

                request.onsuccess = function(e) {
                    let audioFile = e.target.result;
                    if (audioFile) {
                        // Tạo đường dẫn tạm (Blob URL) để trình duyệt phát tệp
                        let audioURL = URL.createObjectURL(audioFile);
                        let player = document.getElementById('audioPlayer');
                        player.src = audioURL;
                        player.style.display = 'block';
                        document.getElementById('loadingStatus').style.display = 'none';
                        player.play().catch(err => {
                            console.log("Trình duyệt chặn tự động phát:", err);
                        });
                    } else {
                        document.getElementById('loadingStatus').textContent = 'Không tìm thấy tệp âm thanh trong cơ sở dữ liệu!';
                    }
                };
            } catch (err) {
                console.error(err);
                document.getElementById('loadingStatus').textContent = 'Lỗi kết nối cơ sở dữ liệu khi tải âm thanh!';
            }
        });
    </script>
</body>
</html>
